# Default values for the Nexogent microservice chart.
#
# Deploys THREE workloads into the client's EKS:
#   - backend  : Go agent/API (read-only, IRSA)            [Deployment + Service]
#   - frontend : React dashboard served by Nginx            [Deployment + Service]
#   - prowler  : open-source scanner (read-only, IRSA)      [CronJob + Job]
# Plus a shared PVC (Prowler results) and an ALB Ingress for a public URL.

region: us-east-1
bedrockModelId: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

# The read-only IRSA role both the backend and prowler assume. No static keys.
serviceAccount:
  create: true
  name: nexogent-sa
  roleArn: "" # arn:aws:iam::<account>:role/NexogentReadOnly

# Shared volume where the Prowler CronJob writes OCSF JSON and the backend reads it.
prowlerResults:
  enabled: true
  storageClass: gp2
  size: 1Gi
  mountPath: /data/prowler

# ---------------------------------------------------------------- backend ----
backend:
  image:
    repository: ""   # <acct>.dkr.ecr.<region>.amazonaws.com/nexogent
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# --------------------------------------------------------------- frontend ----
frontend:
  image:
    repository: ""   # <acct>.dkr.ecr.<region>.amazonaws.com/nexogent-frontend
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  service:
    port: 80
    targetPort: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# ---------------------------------------------------------------- prowler ----
prowler:
  enabled: true
  image:
    repository: toniblyx/prowler
    tag: latest
    pullPolicy: IfNotPresent
  # Cron schedule (UTC). Default: every 6 hours.
  schedule: "0 */6 * * *"
  # Also run once right after install so the dashboard has Prowler data fast.
  runOnInstall: true
  # Extra args passed to prowler (region is injected automatically).
  args: []
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }

# ---------------------------------------------------------------- ingress ----
# ALB ingress via the AWS Load Balancer Controller. Routes:
#   /        -> frontend
#   /api,/health -> backend
ingress:
  enabled: true
  className: alb
  # Internet-facing ALB. Set to false / internal for a private endpoint.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  host: ""

# Hardened defaults.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

nodeSelector: {}
tolerations: []
affinity: {}
