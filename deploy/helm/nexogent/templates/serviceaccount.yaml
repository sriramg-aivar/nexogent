{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexogent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: bind this SA to the read-only IAM role. No static keys in the cluster.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
{{- end -}}
