apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexogent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexogent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexogent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nexogent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nexogent
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.bedrockModelId | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
