{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexogent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexogent
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # API and health go to the backend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexogent-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: nexogent-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # Everything else goes to the frontend (SPA).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexogent-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end -}}
