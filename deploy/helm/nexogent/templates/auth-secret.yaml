{{- if and .Values.auth.password (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: nexogent-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexogent
type: Opaque
stringData:
  # Single superadmin password (v1 auth gate).
  SUPERADMIN_PASSWORD: {{ .Values.auth.password | quote }}
{{- end }}
