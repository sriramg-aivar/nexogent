apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexogent-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexogent
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexogent.componentSelector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexogent.componentSelector" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nexogent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
      containers:
        - name: backend
          image: "{{ required "backend.image.repository is required" .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.bedrockModelId | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: PROWLER_RESULTS_DIR
              value: {{ .Values.prowlerResults.mountPath | quote }}
          {{- if .Values.prowlerResults.enabled }}
          volumeMounts:
            - name: prowler-results
              mountPath: {{ .Values.prowlerResults.mountPath }}
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.prowlerResults.enabled }}
      volumes:
        - name: prowler-results
          persistentVolumeClaim:
            claimName: nexogent-prowler-results
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexogent-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexogent.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexogent
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "nexogent.componentSelector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
